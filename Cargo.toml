[package]
name = "servo-gtk"
version = "0.1.0"
edition = "2024"

[lib]
name = "servo_gtk"
path = "servo_gtk/lib.rs"
# `rlib` keeps the crate usable by Rust consumers and the in-repo examples;
# `staticlib` produces `libservo_gtk.a`, the artifact the Meson C-API build
# links whole into `libservo-gtk.so`.
crate-type = ["rlib", "staticlib"]

[[example]]
name = "browser"
path = "examples/browser.rs"

[[example]]
name = "user_content"
path = "examples/user_content.rs"

[dependencies]
gio = "0.22"
glib = { version = "0.22", features = ["v2_74", "log_macros"] }
gtk = { package="gtk4", version="0.11", features=["v4_12"] }
servo = { git = "https://github.com/servo/servo.git", rev = "aac43a3f31a259f04a574f5ec4e959c943ad7cc7", default-features = false, features = ["bundled_freetype", "clipboard", "js_jit"] }
servo-embedder-traits = { git = "https://github.com/servo/servo.git", rev = "aac43a3f31a259f04a574f5ec4e959c943ad7cc7" }
epoxy = "0.1.0"
libloading = "0.9"
euclid = "0.22"
url = "2.3"
dpi = "0.1"
rustls = { version = "0.23.12", default-features = false, features = ["aws-lc-rs"] }
async-channel = "2.5.0"
log = "0.4.0"
image = "0.25"
keyboard-types = "0.8"
prost = "0.14"
serde_json = "1"

[build-dependencies]
prost-build = "0.14"
glib-build-tools = "0.22"

# Use a fork of epoxy that fixes the build; the upstream 0.1.0 crate blocks `cargo update`.
[patch.crates-io]
epoxy = { git = "https://github.com/theCapypara/epoxy-rs", rev = "7d9d88a8dfec2ddedc647b7a8f6c1e5b3e6c6ec0" }

# Build against a local Servo checkout next to this one, on the `scroll-state-api` branch,
# which adds the scroll state API used for scrollbars. Drop this once that is merged
# upstream and the `rev` above points at a Servo commit that has it.
[patch."https://github.com/servo/servo.git"]
servo = { path = "../servo/components/servo" }
servo-embedder-traits = { path = "../servo/components/shared/embedder" }
