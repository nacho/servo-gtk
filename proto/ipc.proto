syntax = "proto3";

package servo_ipc;

message ServoAction {
  oneof action {
    LoadUrl load_url = 1;
    bool reload = 2;
    bool go_back = 3;
    bool go_forward = 4;
    Resize resize = 5;
    Motion motion = 6;
    ButtonPress button_press = 7;
    ButtonRelease button_release = 8;
    KeyPress key_press = 9;
    KeyRelease key_release = 10;
    Scroll scroll = 11;
    TouchBegin touch_begin = 12;
    TouchUpdate touch_update = 13;
    TouchEnd touch_end = 14;
    TouchCancel touch_cancel = 15;
    bool shutdown = 16;
    AddUserScript add_user_script = 17;
    AddUserStyleSheet add_user_style_sheet = 18;
    bool remove_all_user_scripts = 19;
    bool remove_all_user_style_sheets = 20;
    RegisterScriptMessageHandler register_script_message_handler = 21;
    UnregisterScriptMessageHandler unregister_script_message_handler = 22;
    EvaluateJavascript evaluate_javascript = 23;
    SetZoomLevel set_zoom_level = 24;
    SetHidpiScaleFactor set_hidpi_scale_factor = 25;
    LoadHtml load_html = 26;
    ServoResponse response = 27;
    Ping ping = 28;
    AdblockRulesUpdate update_adblock_rules = 29;
    SetAdblockLevel set_adblock_level = 30;
    SetAdblockBlob set_adblock_blob = 31;
  }
}

// ============================================================
// Adblock extensions
// ============================================================

// UI -> runner: load or clear filter rules.
message AdblockRulesUpdate {
  string action = 1;
  repeated string rules = 2;
}

enum AdblockLevel {
  ADBLOCK_OFF = 0;
  ADBLOCK_STANDARD = 1;
  ADBLOCK_AGGRESSIVE = 2;
}

message SetAdblockLevel {
  AdblockLevel level = 1;
}

// UI -> runner: deserialize a pre-serialized adblock engine blob.
//
// Building an engine from ~180k rules takes 5-15s; deserializing a blob
// takes ~200ms. The UI builds the blob once (see Kestrel's adblock_rules
// module) and sends it here for each tab's runner subprocess.
message SetAdblockBlob {
  bytes blob = 1;
}

message AdblockBlocked {
  string url = 1;
  string resource_type = 2;
}

// ============================================================
// Existing definitions
// ============================================================

message Ping {
}

message ServoResponse {
  uint64 request_id = 1;
  oneof payload {
    PingResponse ping = 2;
    ScriptDialogResponse script_dialog = 3;
    FileChooserResponse file_chooser = 4;
    AuthResponse auth = 5;
    PermissionResponse permission = 6;
    ContextMenuResponse context_menu = 7;
  }
}

message PingResponse {
  bool ok = 1;
}

message ScriptDialogResponse {
  bool confirmed = 1;
  string value = 2;
}

message FileChooserResponse {
  repeated string paths = 1;
}

message AuthResponse {
  bool confirmed = 1;
  string username = 2;
  string password = 3;
}

message PermissionResponse {
  bool allow = 1;
}

message ContextMenuResponse {
  bool selected = 1;
  uint32 index = 2;
}

message SetZoomLevel {
  double level = 1;
}

message SetHidpiScaleFactor {
  float scale = 1;
}

message LoadHtml {
  string html = 1;
  string base_url = 2;
}

message LoadUrl {
  string url = 1;
}

message Resize {
  uint32 width = 1;
  uint32 height = 2;
}

message Motion {
  double x = 1;
  double y = 2;
}

message ButtonPress {
  uint32 button = 1;
  double x = 2;
  double y = 3;
}

message ButtonRelease {
  uint32 button = 1;
  double x = 2;
  double y = 3;
}

enum Location {
  STANDARD = 0;
  LEFT = 1;
  RIGHT = 2;
  NUMPAD = 3;
}

enum KeyType {
  CHARACTER = 0;
  NAMED = 1;
}

message KeyPress {
  string key = 1;
  KeyType key_type = 2;
  Location location = 3;
  uint32 key_code = 4;
  uint32 modifiers = 5;
}

message KeyRelease {
  string key = 1;
  KeyType key_type = 2;
  Location location = 3;
  uint32 key_code = 4;
  uint32 modifiers = 5;
}

message Scroll {
  double dx = 1;
  double dy = 2;
}

message TouchBegin {
  double x = 1;
  double y = 2;
}

message TouchUpdate {
  double x = 1;
  double y = 2;
}

message TouchEnd {
  double x = 1;
  double y = 2;
}

message TouchCancel {
  double x = 1;
  double y = 2;
}

message ServoEvent {
  oneof event {
    FrameReady frame_ready = 1;
    CursorChanged cursor_changed = 2;
    TitleChanged title_changed = 3;
    UrlChanged url_changed = 4;
    LoadStart load_start = 5;
    LoadEnd load_end = 6;
    LogMessage log_message = 7;
    ScriptMessage script_message = 8;
    PingRequest ping_request = 9;
    ScriptDialogRequest script_dialog_request = 10;
    FileChooserRequest file_chooser_request = 11;
    AuthRequest auth_request = 12;
    PermissionRequest permission_request = 13;
    CreateWebView create_web_view = 14;
    ContextMenuRequest context_menu_request = 15;
    AdblockBlocked adblock_blocked = 16;
  }
}

message PingRequest {
  uint64 request_id = 1;
}

enum ScriptDialogKind {
  ALERT = 0;
  CONFIRM = 1;
  PROMPT = 2;
}

message ScriptDialogRequest {
  uint64 request_id = 1;
  ScriptDialogKind kind = 2;
  string message = 3;
  string default_value = 4;
}

message FileChooserRequest {
  uint64 request_id = 1;
  bool allow_multiple = 2;
  repeated string filter_patterns = 3;
}

message AuthRequest {
  uint64 request_id = 1;
  string url = 2;
  bool for_proxy = 3;
}

message PermissionRequest {
  uint64 request_id = 1;
  string feature_name = 2;
}

message CreateWebView {
  string url = 1;
}

message ContextMenuEntry {
  string label = 1;
  bool enabled = 2;
  bool separator = 3;
}

message ContextMenuRequest {
  uint64 request_id = 1;
  repeated ContextMenuEntry items = 2;
  int32 x = 3;
  int32 y = 4;
}

message FrameReady {
  bytes rgba_data = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message CursorChanged {
  string cursor = 1;
}

message TitleChanged {
  string title = 1;
}

message UrlChanged {
  string url = 1;
}

message LoadStart {
  string url = 1;
}

message LoadEnd {
  string url = 1;
}

enum LogLevel {
  DEBUG = 0;
  INFO = 1;
  WARN = 2;
  ERROR = 3;
}

message LogMessage {
  LogLevel level = 1;
  string message = 2;
}

message AddUserScript {
  string source = 1;
}

message AddUserStyleSheet {
  string source = 1;
}

message RegisterScriptMessageHandler {
  string name = 1;
}

message UnregisterScriptMessageHandler {
  string name = 1;
}

message EvaluateJavascript {
  string source = 1;
}

message ScriptMessage {
  string name = 1;
  string body = 2;
}
