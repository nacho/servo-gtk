syntax = "proto3";

package servo_ipc;

message ServoAction {
  oneof action {
    LoadUrl load_url = 1;
    bool reload = 2;
    bool go_back = 3;
    bool go_forward = 4;
    Resize resize = 5;
    Motion motion = 6;
    ButtonPress button_press = 7;
    ButtonRelease button_release = 8;
    KeyPress key_press = 9;
    KeyRelease key_release = 10;
    Scroll scroll = 11;
    TouchBegin touch_begin = 12;
    TouchUpdate touch_update = 13;
    TouchEnd touch_end = 14;
    TouchCancel touch_cancel = 15;
    bool shutdown = 16;
    AddUserScript add_user_script = 17;
    AddUserStyleSheet add_user_style_sheet = 18;
    bool remove_all_user_scripts = 19;
    bool remove_all_user_style_sheets = 20;
    RegisterScriptMessageHandler register_script_message_handler = 21;
    UnregisterScriptMessageHandler unregister_script_message_handler = 22;
    EvaluateJavascript evaluate_javascript = 23;
  }
}

message LoadUrl {
  string url = 1;
}

message Resize {
  uint32 width = 1;
  uint32 height = 2;
}

message Motion {
  double x = 1;
  double y = 2;
}

message ButtonPress {
  uint32 button = 1;
  double x = 2;
  double y = 3;
}

message ButtonRelease {
  uint32 button = 1;
  double x = 2;
  double y = 3;
}

enum Location {
  STANDARD = 0;
  LEFT = 1;
  RIGHT = 2;
  NUMPAD = 3;
}

enum KeyType {
  CHARACTER = 0;
  NAMED = 1;
}

message KeyPress {
  string key = 1;
  KeyType key_type = 2;
  Location location = 3;
  uint32 key_code = 4;
  uint32 modifiers = 5;
}

message KeyRelease {
  string key = 1;
  KeyType key_type = 2;
  Location location = 3;
  uint32 key_code = 4;
  uint32 modifiers = 5;
}

message Scroll {
  double dx = 1;
  double dy = 2;
}

message TouchBegin {
  double x = 1;
  double y = 2;
}

message TouchUpdate {
  double x = 1;
  double y = 2;
}

message TouchEnd {
  double x = 1;
  double y = 2;
}

message TouchCancel {
  double x = 1;
  double y = 2;
}

message ServoEvent {
  oneof event {
    FrameReady frame_ready = 1;
    CursorChanged cursor_changed = 2;
    TitleChanged title_changed = 3;
    UrlChanged url_changed = 4;
    LoadStart load_start = 5;
    LoadEnd load_end = 6;
    LogMessage log_message = 7;
    ScriptMessage script_message = 8;
  }
}

message FrameReady {
  bytes rgba_data = 1;
  uint32 width = 2;
  uint32 height = 3;
}

message CursorChanged {
  string cursor = 1;
}

message TitleChanged {
  string title = 1;
}

message UrlChanged {
  string url = 1;
}

message LoadStart {
  string url = 1;
}

message LoadEnd {
  string url = 1;
}

enum LogLevel {
  DEBUG = 0;
  INFO = 1;
  WARN = 2;
  ERROR = 3;
}

message LogMessage {
  LogLevel level = 1;
  string message = 2;
}

// A user script to inject into every page loaded in the WebView. Mirrors the
// role of WebKitUserScript. Servo does not support injection-time or
// injected-frames options at this revision, so only the source is carried.
message AddUserScript {
  string source = 1;
}

// A user CSS style sheet to inject into every page loaded in the WebView.
message AddUserStyleSheet {
  string source = 1;
}

// Register a named script message handler. Injected page JavaScript can then
// call `window.servoGtk.messageHandlers.<name>.postMessage(value)` to send a
// message to the native side, delivered back as a ScriptMessage event.
message RegisterScriptMessageHandler {
  string name = 1;
}

// Unregister a previously registered named script message handler.
message UnregisterScriptMessageHandler {
  string name = 1;
}

// Evaluate a snippet of JavaScript in the page. Fire-and-forget: the result is
// not currently returned to the native side.
message EvaluateJavascript {
  string source = 1;
}

// A message sent from page JavaScript to the native side via a registered
// script message handler. `body` is the JSON-serialized message value.
message ScriptMessage {
  string name = 1;
  string body = 2;
}
